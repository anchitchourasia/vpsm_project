<div class="page" id="stickerArea">

    <div
    #stickerArea
    class="sticker"
    [class.heg]="empType() === 'HEG'"
    [class.contract]="empType() !== 'HEG'">

        <!-- Logo -->
        <img src="assets/heg-logo.png" class="logo" alt="HEG Logo">

        <!-- Heading -->
        <div class="title1">
            {{ empType() === 'HEG'
            ? 'VEHICLE ENTRY PASS'
            : 'CONTRACTOR' }}
        </div>

        @if(empType() !== 'HEG'){
        <div class="title2">
            VEHICLE ENTRY PASS
        </div>
        }

        <div class="company">
            HEG LTD.
        </div>

        <!-- Pass No -->
        <div class="detail-row">
            <span class="label">PASS NO</span>
            <span class="colon">:</span>
            <span class="value">{{ passNo() }}</span>
        </div>

        <!-- Gate -->
        <div class="detail-row">
            <span class="label">GATE</span>
            <span class="colon">:</span>
            <span class="value">{{ gateNo() }}</span>
        </div>

        <!-- Parking -->
        <div class="detail-row">
            <span class="value">{{ parkingToBeUsed() }}</span>
        </div>

    </div>

</div>

<button
    class="print-btn"
    (click)="printSticker()">

    Print Sticker

</button>
